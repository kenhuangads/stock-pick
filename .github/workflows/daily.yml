name: 每日更新

on:
  schedule:
    # 平日多發兜底：GitHub 免費排程在尖峰（13:xx UTC）常延遲數小時甚至靜默不觸發，
    # 故整晚灑 5 發、刻意跨到較不擁擠的較晚 UTC 時段，提高「至少一發準時」機率。
    # 抓取採「往回探最近交易日」，延遲跨午夜也能抓對；程式冪等，先成功者更新後，
    # 後續各發走「快照已完整」快速路徑 ~30s 跳過，不重複做白工。（台北 = UTC+8）
    - cron: '10 13 * * 1-5'   # 21:10 台北
    - cron: '40 13 * * 1-5'   # 21:40 台北
    - cron: '20 14 * * 1-5'   # 22:20 台北
    - cron: '10 15 * * 1-5'   # 23:10 台北
    - cron: '10 16 * * 1-5'   # 00:10 台北（隔日；往回探仍抓當日交易資料）
    # 清晨校正（--dawn）：美股收盤（台北夏令 04:00／冬令 05:00）後抓隔夜訊號重判環境，
    # 方向被翻轉時重出當日建議單（例：2026-07-31 前夜費半 +8.19% 而寬度判空）。兩發兜底。
    - cron: '10 21 * * 0-4'   # 05:10 台北（週一～五）
    - cron: '40 21 * * 0-4'   # 05:40 台北（兜底）
  workflow_dispatch:
    inputs:
      force:
        description: '即使沒有新資料也強制重建輸出'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 晚間初版與清晨校正分屬不同群組：GitHub 每個群組只容一個排隊者，
  # 共用群組時延遲數小時的晚間發次會把清晨校正擠掉（該次校正就永遠不會發生）。
  # 20 UTC 起＝清晨校正時段，與晚間互不取消。
  group: daily-update-${{ contains(github.event.schedule, '21 * * 0-4') && 'dawn' || 'evening' }}
  cancel-in-progress: false

# Pages 採 branch 部署（main 根目錄）：資料 commit push 後 GitHub 自動建置，
# 無需部署 job。（actions/deploy-pages 管線曾整晚故障，branch 模式 30 秒完成。）
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 抓行情 → 復盤 → 迭代優化 → 智能選股（清晨發次為隔夜校正）
        # 以「觸發的 cron 身分」判斷模式，不看執行當下的時鐘：GitHub 排程常延遲數小時，
        # 舊版用 `date -u +%H >= 20` 判斷，延遲跨過 00 UTC 就會誤判成晚間流程、
        # 清晨校正靜默不執行（2026-08-07 實例：21:10 UTC 的發次拖到 01:01 UTC 才跑）。
        env:
          IS_DAWN: ${{ contains(github.event.schedule, '21 * * 0-4') }}
        run: |
          if [ "$IS_DAWN" = "true" ]; then
            python scripts/daily_update.py --dawn
          else
            python scripts/daily_update.py ${{ inputs.force && '--force' || '' }}
          fi
      - name: 復盤紀錄審計（逐筆重放核實，未通過不得 commit）
        run: python scripts/verify_reviews.py
      - name: Commit 資料更新（push 後 Pages 自動建置）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "沒有資料變更（休市或已更新）"
          else
            git commit -m "chore(data): daily update $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi
